services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - vision-storage:/app/storage
    env_file:
      - path: ./百炼.env
        required: false
      - path: ./.env
        required: false
    environment:
      PARKING_DATA_FILE: /app/data/parking.imported.geojson
      DETECTION_MODEL: /app/models/yolo11n.pt
      DETECTION_STORAGE: /app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  vision-storage:
